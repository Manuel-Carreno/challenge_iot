# /etc/mosquitto/conf.d/gateway.conf  (Raspberry Pi 5, Mosquitto 2.0.21)
# El archivo principal /etc/mosquitto/mosquitto.conf es el que trae Raspberry Pi OS
# y no se modifico; esta configuracion se agrega desde conf.d.
listener 1883
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl
